name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate report metadata and chart JSON
        run: node scripts/validate.mjs
      - name: Build catalog
        run: node scripts/build-catalog.mjs
      - name: Syntax-check site scripts
        run: for f in assets/js/*.js shared/brand/charts.js scripts/*.mjs scripts/lib/*.mjs; do node --check "$f" || exit 1; done

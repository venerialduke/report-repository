name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerate_summaries:
        description: "Regenerate every AI summary (ignores the cache)"
        type: boolean
        default: false

permissions:
  contents: write   # to commit the AI summary cache back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate reports
        run: node scripts/validate.mjs

      - name: Generate AI summaries (only when the ANTHROPIC_API_KEY secret is set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-summaries.mjs ${{ inputs.regenerate_summaries && '--force' || '' }}

      - name: Save AI summary cache
        continue-on-error: true
        run: |
          if ! git diff --quiet -- data/ai-summaries.json; then
            git config user.name "insights-hub-bot"
            git config user.email "insights-hub-bot@users.noreply.github.com"
            git add data/ai-summaries.json
            git commit -m "Update AI summary cache [skip ci]"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build catalog, search index and feed
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build-catalog.mjs

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html report.html bundle.html resources.html site.config.json catalog.json search-index.json feed.xml .nojekyll assets shared reports _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

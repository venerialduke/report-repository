name: Refresh catalog & AI summaries

# GitHub Pages serves this repo straight from `main`, so generated files
# (catalog.json, search-index.json, feed.xml, data/ai-summaries.json) must be committed.
# CI requires PRs to commit an up-to-date catalog; this workflow is the safety net and
# adds AI summaries when the ANTHROPIC_API_KEY secret is set.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerate_summaries:
        description: "Regenerate every AI summary (ignores the cache)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate reports
        run: node scripts/validate.mjs

      - name: Generate AI summaries (skipped when ANTHROPIC_API_KEY is not set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-summaries.mjs ${{ inputs.regenerate_summaries && '--force' || '' }}

      - name: Rebuild catalog, search index and feed
        run: node scripts/build-catalog.mjs

      - name: Commit generated files
        id: commit
        run: |
          if git diff --quiet -- catalog.json search-index.json feed.xml data/ai-summaries.json; then
            echo "Generated files are up to date."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "insights-hub-bot"
            git config user.email "insights-hub-bot@users.noreply.github.com"
            git add catalog.json search-index.json feed.xml data/ai-summaries.json
            git commit -m "Refresh catalog and AI summaries [skip ci]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN may not trigger a Pages build on their own
      - name: Request a Pages rebuild
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

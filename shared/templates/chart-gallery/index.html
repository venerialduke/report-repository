<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart gallery — Parcel &amp; Pine Insights</title>
<link rel="stylesheet" href="../../brand/report.css"></head>
<body class="pp-report"><main>
<header class="pp-masthead"><span class="pp-eyebrow">Brand kit</span><h1>Chart gallery</h1><p class="pp-subtitle">Every chart type in <code>shared/brand/charts.js</code>, with the JSON that produces it. Copy, paste, edit the data.</p></header>
<figure class="pp-figure"><p class="pp-fig-title">column — single series with highlight and value labels</p>
<div class="pp-chart"><script type="application/json">{"type":"column","format":"pct","highlight":["Month 3"],"categories":["Month 1","Month 2","Month 3","Month 4","Month 5","Month 6"],"series":[{"name":"Churn","values":[6.1,5.4,11.8,4.9,4.2,3.9]}]}</script></div></figure>
<figure class="pp-figure"><p class="pp-fig-title">column — grouped with reference line</p>
<div class="pp-chart"><script type="application/json">{"type":"column","format":"pct","ref":{"value":90,"label":"SLA 90%"},"categories":["North","South","East","West"],"series":[{"name":"2025","values":[88,91,84,93]},{"name":"2026","values":[92,93,89,95]}]}</script></div></figure>
<figure class="pp-figure"><p class="pp-fig-title">bar — horizontal, long labels</p>
<div class="pp-chart"><script type="application/json">{"type":"bar","format":"pct","ref":{"value":20,"label":"Target 20%"},"highlight":["Item arrived damaged"],"categories":["Item arrived damaged","Didn't match description","Changed my mind","Wrong size / dimensions","Arrived late"],"series":[{"name":"Share of returns","values":[31,24,18,15,12]}]}</script></div></figure>
<figure class="pp-figure"><p class="pp-fig-title">line — multiple series, direct labels</p>
<div class="pp-chart"><script type="application/json">{"type":"line","format":"usd","categories":["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug"],"series":[{"name":"Members","values":[412000,398000,441000,455000,470000,462000,488000,501000]},{"name":"Non-members","values":[301000,290000,305000,299000,310000,322000,318000,315000]}]}</script></div></figure>
<figure class="pp-figure"><p class="pp-fig-title">line — single series, end value label, reference line</p>
<div class="pp-chart"><script type="application/json">{"type":"line","format":"pct1","ref":{"value":95,"label":"SLA 95%"},"categories":["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug"],"series":[{"name":"On-time rate","values":[94.1,93.6,93.0,92.8,92.5,92.3,91.9,92.1]}]}</script></div></figure>
<figure class="pp-figure"><p class="pp-fig-title">stacked — composition over time</p>
<div class="pp-chart"><script type="application/json">{"type":"stacked","format":"num","categories":["Q1","Q2","Q3","Q4"],"series":[{"name":"New","values":[12000,14000,13500,16800]},{"name":"Returning","values":[30000,31500,33000,35400]},{"name":"Reactivated","values":[4000,4200,3900,5100]}]}</script></div></figure>
<figure class="pp-figure"><p class="pp-fig-title">stacked-bar — 100% composition</p>
<div class="pp-chart"><script type="application/json">{"type":"stacked-bar","format":"pct","yMax":100,"categories":["Promoters","Passives","Detractors"],"series":[{"name":"Delivery","values":[20,35,52]},{"name":"Product","values":[55,40,28]},{"name":"Service","values":[25,25,20]}]}</script></div></figure>
</main><script src="../../brand/charts.js"></script></body></html>
